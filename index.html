<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Соревнования</title>
<style>
:root{--bg:#f1f4f9;--card:#fff;--text:#1b2437;--muted:#6b7690;--line:#dde3ee;--pri:#2f66ff;--pri-d:#2350d6;--soft:#eaf0ff;--ok:#0b8f63;--warn:#b45309;--head:#0f1b3d}
@media (prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--text:#e8edf8;--muted:#93a0bd;--line:#26314f;--pri:#5b8bff;--pri-d:#7aa0ff;--soft:#1e2b4d;--ok:#34d399;--warn:#fbbf24;--head:#0a1020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--head);color:#fff;padding:22px 16px 18px}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:#9fb0d9;font-size:14px}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--pri);border-color:transparent}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}
.pri{background:var(--pri);color:#fff;width:100%;margin-top:12px}
.pri:hover{background:var(--pri-d)}
.link{background:none;color:var(--pri);padding:8px 0;font-weight:600}
.hint{color:var(--muted);font-size:14px;margin:8px 0 0}
.msg{padding:12px 14px;border-radius:10px;background:var(--soft);margin-top:12px}
.err{background:#fee2e2;color:#991b1b}
@media (prefers-color-scheme:dark){.err{background:#4a1d1d;color:#fecaca}}
.who{font-size:20px;font-weight:700;margin:0}
.club{color:var(--muted);font-size:14px;margin:2px 0 10px}
.entry{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.entry:first-of-type{border-top:0}
.cat{font-weight:600}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--pri-d);margin-right:6px;vertical-align:1px}
.when{text-align:right}
.big{font-size:22px;font-weight:800;line-height:1.1}
.day{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:#2F66FF;border-radius:6px;padding:1px 7px;margin-bottom:3px}
.doy{font-size:14px;color:var(--muted)}
.state{font-size:13px;color:var(--warn);font-weight:600}
.state.done{color:var(--ok)}
.side{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;margin-top:4px;color:#fff}
.side.red{background:#d62839}
.side.blue{background:#2456d6}
.side.none{background:var(--soft);color:var(--muted);font-weight:600}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:var(--soft);color:var(--pri-d)}
.tab.on{background:var(--pri);color:#fff}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
ol{margin:8px 0 0;padding-left:26px}
li{padding:2px 0}
li.mine{font-weight:700;color:var(--pri-d)}
li small{color:var(--muted);font-weight:400}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:8px 16px 28px}
.hide{display:none}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><p id="sub"></p></header>
<main>
 <section id="parent" class="card">
  <label for="fio">Фамилия и имя спортсмена</label>
  <input id="fio" placeholder="Например: Иванов Иван" autocomplete="off" enterkeyhint="search">
  <button class="pri" id="go">Найти мою категорию</button>
  <p class="hint">Введите фамилию и имя так, как спортсмен указан в заявке.</p>
  <div id="res"></div>
  <button class="link" id="toTrainer">Я тренер →</button>
 </section>
 <section id="coach" class="card hide">
  <label for="tfio">Фамилия и имя тренера</label>
  <input id="tfio" placeholder="Например: Петров Пётр" autocomplete="off">
  <label for="tpw" style="margin-top:12px">Пароль</label>
  <input id="tpw" type="password" autocomplete="off">
  <button class="pri" id="tgo">Войти</button>
  <div id="tres"></div>
  <button class="link" id="toParent">← Назад</button>
 </section>
 <p class="foot" id="foot"></p>
</main>

var K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256hex(str){
 var b=new TextEncoder().encode(str),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);
 m.set(b);m[l]=0x80;var dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
 var H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]),w=new Uint32Array(64);
 function R(x,k){return (x>>>k)|(x<<(32-k))}
 for(var o=0;o<n;o+=64){
  for(var i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(i=16;i<64;i++){var s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
  var a=H[0],b2=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],hh=H[7];
  for(i=0;i<64;i++){
   var S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])>>>0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&b2)^(a&c)^(b2&c),t2=(S0+mj)>>>0;
   hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b2;b2=a;a=(t1+t2)>>>0}
  H[0]+=a;H[1]+=b2;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=hh}
 return Array.prototype.map.call(H,function(x){return ("00000000"+x.toString(16)).slice(-8)}).join("");
}
function hid(kind,key){return sha256hex(D.salt+"|"+kind+"|"+key).slice(0,16)}

/* ---- родитель ---- */
function athleteKeys(q){
 var t=norm(q).split(" ").filter(Boolean),k=[];
 if(t.length<2)return k;
 k.push(t.slice().sort().join(" "));
 if(t.length>2)k.push(t.slice(0,2).sort().join(" "));
 return k;
}
var DISC_LABEL={};
function dayOf(e){return e[11]?"День "+e[11]+" · ":""}
function whenBlock(e){
 var w=h("div","when"),st=e[7],D=dayOf(e);
 if(st==="done"){w.appendChild(h("div","state done","уже проведена"));w.appendChild(h("div","doy",D+(e[5]==="Туль / спарринг"?"Доянг "+e[4]:e[5]+" · доянг "+e[4])));return w}
 if(st==="single"||st==="empty"){w.appendChild(h("div","state","в категории один участник"));w.appendChild(h("div","doy",D+"Доянг "+e[4]+" — уточните у судей"));return w}
 if(e[11])w.appendChild(h("div","day","День "+e[11]));
 w.appendChild(h("div","big","≈ "+e[6]));
 w.appendChild(h("div","doy","Доянг "+e[4]+(e[5]!=="Туль / спарринг"?" · "+e[5]:"")));
 if(st==="now")w.appendChild(h("div","state","категория уже идёт"));
 return w;
}
function sideBadge(s){if(!s)return null;if(s==="n")return h("span","side none","Цвет экипировки — после жеребьёвки");return h("span","side "+(s==="r"?"red":"blue"),s==="r"?"Красная экипировка":"Синяя экипировка")}
function entryRow(e,showN){
 var r=h("div","entry"),l=h("div");
 var c=h("div","cat");c.appendChild(h("span","badge",e[1]));
 c.appendChild(document.createTextNode((e[2]?e[2]+" ":"")+e[3]));l.appendChild(c);
 var sb=sideBadge(e[9]);if(sb){var sw=h("div");sw.appendChild(sb);l.appendChild(sw)}
 if(e[10])l.appendChild(h("div","doy",e[10]));
 if(showN)l.appendChild(h("div","doy","Участников в категории: "+e[8]));
 r.appendChild(l);r.appendChild(whenBlock(e));return r;
}
function personCard(p,showN){
 var box=h("div","card");
 box.appendChild(h("p","who",p.n));
 box.appendChild(h("p","club",p.c||""));
 if(!p.e.length)box.appendChild(h("div","hint","Пока нет категорий."));
 p.e.forEach(function(e){box.appendChild(entryRow(e,showN))});
 return box;
}
function doSearch(){
 var out=$("res");out.textContent="";
 var keys=athleteKeys($("fio").value);
 if(!keys.length){out.appendChild(h("div","msg err","Введите фамилию и имя."));return}
 var seen={},found=[];
 keys.forEach(function(k){(D.a[hid("a",k)]||[]).forEach(function(i){if(!seen[i]){seen[i]=1;found.push(i)}})});
 if(!found.length){out.appendChild(h("div","msg err","Такого спортсмена в списках нет. Проверьте написание фамилии и имени (можно в любом порядке)."));return}
 found.forEach(function(i){out.appendChild(personCard(D.P[i],false))});
}
$("go").onclick=doSearch;
$("fio").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});

/* ---- тренер ---- */
function trainerKeys(q){
 var t=norm(q).split(" ").filter(Boolean),k=[];
 if(!t.length)return k;
 if(t.length>1)k.push(t[0]+" "+t[1][0]);
 k.push(t[0]);
 return k;
}
function hex2b(x){var a=new Uint8Array(x.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(x.substr(i*2,2),16);return a}
function b642b(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function hmac(keyRaw,data){
 var k=await crypto.subtle.importKey("raw",keyRaw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
 return new Uint8Array(await crypto.subtle.sign("HMAC",k,data));
}
async function decrypt(pw,tkey,blob){
 var te=new TextEncoder();
 var pk=await crypto.subtle.importKey("raw",te.encode(pw+"|"+tkey),"PBKDF2",false,["deriveBits"]);
 var base=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:hex2b(D.salt),iterations:D.iters},pk,256));
 var enc=await hmac(base,te.encode("enc")),mac=await hmac(base,te.encode("mac"));
 var raw=b642b(blob),nonce=raw.slice(0,16),tag=raw.slice(16,48),ct=raw.slice(48);
 var cat=new Uint8Array(16+ct.length);cat.set(nonce);cat.set(ct,16);
 var t2=await hmac(mac,cat),bad=0;for(var i=0;i<32;i++)bad|=t2[i]^tag[i];
 if(bad)return null;
 var n=Math.ceil(ct.length/32),jobs=[];
 for(i=0;i<n;i++){var m=new Uint8Array(20);m.set(nonce);new DataView(m.buffer).setUint32(16,i);jobs.push(hmac(enc,m))}
 var ks=await Promise.all(jobs),out=new Uint8Array(ct.length);
 for(i=0;i<ct.length;i++)out[i]=ct[i]^ks[i>>5][i&31];
 return JSON.parse(new TextDecoder().decode(out));
}
function renderCoach(P){
 var out=$("tres");out.textContent="";
 out.appendChild(h("div","msg","Тренер: "+P.t+". Спортсменов: "+P.A.length+"."));
 var tabs=h("div","tabs"),b1=h("button","tab on","Мои спортсмены"),b2=h("button","tab","Категории и составы");
 tabs.appendChild(b1);tabs.appendChild(b2);out.appendChild(tabs);
 var v1=h("div"),v2=h("div","hide");
 P.A.forEach(function(p){v1.appendChild(personCard(p,true))});
 P.C.forEach(function(c){
  var e=c.e,d=document.createElement("details"),s=document.createElement("summary");
  s.appendChild(h("span","badge",e[1]));
  s.appendChild(document.createTextNode((e[2]?e[2]+" ":"")+e[3]+(e[10]?" ("+e[10].replace("Возраст: ","").replace("Вес: ","")+")":"")+" — "+e[8]+" чел. · "+(e[11]?"день "+e[11]+", ":"")+"доянг "+e[4]+(e[7]==="done"?" · проведена":" · ≈ "+e[6])));
  d.appendChild(s);
  var ol=document.createElement("ol");
  c.m.forEach(function(m){var li=document.createElement("li");if(m[2])li.className="mine";li.appendChild(document.createTextNode(m[0]));if(m[3]){li.appendChild(document.createTextNode(" "));li.appendChild(sideBadge(m[3]))}if(m[1])li.appendChild(h("small"," — "+m[1]));ol.appendChild(li)});
  d.appendChild(ol);v2.appendChild(d);
 });
 var card2=h("div","card");card2.appendChild(v2);
 out.appendChild(v1);out.appendChild(card2);card2.classList.add("hide");
 b1.onclick=function(){b1.className="tab on";b2.className="tab";v1.classList.remove("hide");card2.classList.add("hide")};
 b2.onclick=function(){b2.className="tab on";b1.className="tab";card2.classList.remove("hide");v2.classList.remove("hide");v1.classList.add("hide")};
}
async function coachGo(){
 var out=$("tres");out.textContent="";
 var pw=$("tpw").value,keys=trainerKeys($("tfio").value);
 if(!keys.length||!pw){out.appendChild(h("div","msg err","Введите фамилию, имя и пароль."));return}
 if(!(window.crypto&&crypto.subtle)){out.appendChild(h("div","msg err","Этот режим работает только при открытии страницы по защищённой ссылке (https)."));return}
 var wait=h("div","msg","Проверяю…");out.appendChild(wait);
 try{
  for(var i=0;i<keys.length;i++){
   var blob=D.t[hid("t",keys[i])];
   if(!blob)continue;
   var P=await decrypt(pw,keys[i],blob);
   if(P){$("tpw").value="";renderCoach(P);return}
  }
 }catch(e){}
 out.textContent="";
 out.appendChild(h("div","msg err","Неверные данные: проверьте фамилию, имя тренера и пароль."));
}
$("tgo").onclick=coachGo;
$("tpw").addEventListener("keydown",function(e){if(e.key==="Enter")coachGo()});
$("toTrainer").onclick=function(){$("parent").classList.add("hide");$("coach").classList.remove("hide");$("tfio").focus()};
$("toParent").onclick=function(){$("coach").classList.add("hide");$("parent").classList.remove("hide");$("tres").textContent="";$("tpw").value=""};
</script>
